name: Release Anki APKG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-render.txt

      # P0：发布物必须由当前 tag 指向的源码重建，并与 golden 身份一致。
      - name: Build public decks from source
        run: python scripts/build_public_decks.py --out dist --check-golden

      - name: Verify built APKGs
        run: |
          for apkg in dist/Android.apkg dist/MQTT.apkg; do
            echo "::group::$apkg"
            python -m ankicards verify "$apkg"
            echo "::endgroup::"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }} — 可复现构建

            ### ⚠️ 升级说明

            **从 v0.3.2 / v0.4.0 / v0.4.1 / v0.4.2 / v0.4.3 / v0.4.4 升级到 0.4.5**：原知识卡、对比题、模型与牌组 id 均未变化，
            可直接导入覆盖（Anki 按 guid 更新，不会产生重复卡片）。

            **如果你导入过 0.4.3 的对比题**：请先在 Anki 里删除子牌组 `Android面试::对比题`，再导入 0.4.5。
            0.4.4 起对比题 key 改为内容派生，guid 会变化；从 0.4.4 升级则无需删除。

            **从 v0.3.0/v0.3.1 升级**：那一版的模型与 guid 与现在**不兼容**，直接覆盖会产生
            **重复卡片**，请务必：

            1. 先在 Anki 中导出备份；
            2. 删除旧根牌组 `Android面试` 与 `MQTT协议`（含子牌组）；
            3. 再导入本版本的 `.apkg`。

            旧 note type 若已无卡片，可在“工具 → 管理笔记类型”中一并删除。

            ### 0.4.5 新增：Android 与 MQTT 派生题

            - Android 2305 张：1270 知识 + 326 填空 + 651 选择 + 58 对比（新增 `Android面试::填空`、`选择题`）
            - MQTT 308 张：200 知识 + 30 填空 + 78 选择（新增 `MQTT协议::填空`、`选择题`；对比题为 0）
            - 派生题不二次派生；题库导出格式（题干内嵌选项 / 答案「正确答案：」）整卡跳过
            - 挖空拒绝反引号、未完成词结尾、问题或牌组主题词已出现的片段

            ### 0.4.4 新增：对比题候选质量修复

            - 元词标签过滤扩展（包含/分为/场景/原因/原理/代码/示例/正解/开销…），标签形状受限
            - 跳过代码/示例型答案的整张卡；同一标签对去重
            - 对比题 key 改为「源卡串 + 题干」派生，候选增删时保留卡 guid 不漂移
            - 同一随机种子抽检 10/10 为真概念对比；Android 仍 1328 张（1270 主卡 + 58 对比题）

            ### 0.4.3 新增：对比题并入 Android 发布牌组

            - 卡内条目候选经 `derive contrast` 折成 58 张对比题，随主牌组同包发布
            - 新分区 `Android面试::对比题`；原 1270 张 guid 不变，Android 共 1328 张
            - `build_public_decks.py` 构建时自动生成对比题分区
            - 对比题答案必须包含 `sources` 里每条逐字 `quote`，`derive check` 把关

            ### 0.4.2 新增：模型候选协作（M3）

            - `derive packet`：导出素材包（含 `correct_chars`），外部模型写干扰项
            - `derive merge`：候选逐条过闸后并入 plan，标 `origin:"model"` 与 `review:true`
            - `--prefer-model` 配合 `--options 3` 可得「1 正确 + 2 模型」、零同牌组噪声
            - `derive check` 对选项长度比 >2 提示「可能泄漏答案」

            ### 0.4.1 新增：派生题

            - `derive plan/check/compile/report/packet`：从已发布牌组派生填空与选择题
            - 正确项与挖空都是源答案里的逐字片段；代码块/压平表格整卡跳过（`code_snippet`）
            - 干扰项优先同牌组，给了 `--ingest` 才用本地语料，模型候选需人工审
            - Android 1270 张 → 填空 402 / 选择 651；MQTT 200 张 → 填空 144 / 选择 178

            ### 0.4.0 新增

            - `plan.json` 抽取契约：每卡逐字 `quote`，确定性校验通过才编译成卡
            - 续行/子项按组归并，区间定位（`line:6-7`、`page:N-M`）可作为来源
            - EPUB（`chapter:C/p:M`）、`--profile manual|novel|essay`、五种卡型
            - `--density` 密度检查、`--also` 跨格式交叉校验、`--incremental` 增量更新
            - `scripts/precheck.py` 可卡性预检；数字按数值比对（`三天` = `3 天`）

            ### 卡组列表

            | 卡组 | 说明 |
            |------|------|
            | Android.apkg | Android 开发面试，1270 张卡片 |
            | MQTT.apkg | MQTT 协议知识，200 张卡片（含 AI 选择题） |

            ### 构建与校验

            两个包都由当前 tag 的源码 + `data/Android`、`data/MQTT` 重建，
            并通过 `scripts/build_public_decks.py --check-golden` 的 guid/模型/牌组身份校验。

            ### 已知限制

            - `--ingest` 证明「定位存在」；同时给出 `--pdf/--docx/--txt/--html` 时会比对
              `source_sha256`，不一致直接拒绝。跨文档/机密材料的溯源仍需要人工确认。
            - 未包含 Anki/AnkiDroid 真机导入验收；结构审计已通过。
            - 变更清单与验证记录见仓库 `CHANGELOG.md`。

            ### 使用方法

            1. 下载需要的 `.apkg` 文件；
            2. 打开 Anki → 文件 → 导入 → 选择 `.apkg` 文件；
            3. 开始复习。

          files: |
            dist/Android.apkg
            dist/MQTT.apkg
          prerelease: false
          make_latest: true
