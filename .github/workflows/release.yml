name: Release Anki APKG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify APKGs exist
        run: |
          APKGS=$(find output -name "*.apkg" -type f)
          if [ -z "$APKGS" ]; then
            echo "❌ output/ 下没有 .apkg 文件！"
            exit 1
          fi
          echo "✅ 找到以下卡组："
          for f in $APKGS; do
            echo "  - $f ($(du -h "$f" | cut -f1))"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            ### 卡组列表
            | 卡组 | 说明 |
            |------|------|
            | Android面试卡组 | Android 开发面试，1270 张卡片 |
            | MQTT协议卡组 | MQTT 协议知识，200 张卡片（含 AI 选择题） |

            ### 使用方法
            1. 下载需要的 `.apkg` 文件
            2. 打开 Anki → 文件 → 导入 → 选择 .apkg 文件
            3. 开始复习！

          files: |
            output/Android面试卡组.apkg
            output/MQTT协议卡组.apkg
          prerelease: false
          make_latest: true
