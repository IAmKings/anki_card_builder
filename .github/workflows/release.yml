name: Release Anki APKG

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Verify APKGs exist
        run: |
          APKGS=$(find output -name "*.apkg" -type f)
          if [ -z "$APKGS" ]; then
            echo "❌ output/ 下没有 .apkg 文件！"
            exit 1
          fi
          echo "✅ 找到以下卡组："
          for f in $APKGS; do
            echo "  - $f ($(du -h "$f" | cut -f1))"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Anki 卡组 - ${{ steps.date.outputs.DATE }}"
          tag_name: release-${{ steps.date.outputs.DATE }}
          body: |
            ## Anki 卡组合集

            **自动构建于**: ${{ github.event.head_commit.timestamp }}

            ### 卡组列表
            | 卡组 | 说明 |
            |------|------|
            | Android面试卡组 | Android 开发面试，1270 张卡片 |
            | MQTT协议卡组 | MQTT 协议知识，200 张卡片（含 AI 选择题） |

            ### 使用方法
            1. 下载需要的 `.apkg` 文件
            2. 打开 Anki → 文件 → 导入 → 选择 .apkg 文件
            3. 开始复习！

          files: |
            output/*.apkg
          prerelease: false
          make_latest: true
